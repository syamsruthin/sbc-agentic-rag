# Install once per clone: pre-commit install
# The original pipeline modules are kept byte-for-byte as moved (see pyproject.toml).
exclude: ^packages/sbc_ingest/src/sbc_ingest/(portal|to_markdown|verify)\.py$

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (module boundaries)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: (^|/)pyproject\.toml$|^uv\.lock$
        pass_filenames: false
