[project]
name = "sbc-tools"
version = "0.0.0"
description = "Agent tools, including the deterministic cost calculator."
requires-python = ">=3.13"
dependencies = [
    "sbc-core",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbc_tools"]
