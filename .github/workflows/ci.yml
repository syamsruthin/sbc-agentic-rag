name: CI

on:
  pull_request:
  push:
    # main_AWS is the long-lived branch of the AWS implementation; it is not merged into main.
    # main_local is the full local stack (docs/local/LOCAL_PLAN.md), for local runs only; it is never merged.
    # Only main_AWS deploys.
    branches: [main, main_AWS, main_local]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests cancel older runs; pushes queue, so a deploy (below) is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the uv version that writes uv.lock.
  UV_VERSION: "0.7.19"

jobs:
  lint:
    name: Lint, format and module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit --cov --cov-report=term-missing

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --redact --no-banner

  eval-gate:
    name: Eval gate (deterministic)
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      # PLAN.md section 5.5, deterministic suite: validates every committed golden dataset and runs the
      # retrieval eval (BM25-only, the bundle's own index) on the synthetic fixture bundle; any hard-gate failure
      # (plan filter below 100%, a confident wrong-plan resolution) fails the job. CI has no SBC corpus, so
      # the real-corpus eval runs where the facts bundle is built. The LLM smoke set joins in Phase 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m evals.harness.ci_gate

  image:
    name: API image builds and passes the smoke test
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      # docs/aws/MIGRATION_PLAN.md WP8: the Lambda image, built on the synthetic fixture bundle (CI has no SBC
      # corpus) and started the way Lambda runs it (read-only root). The arm64 build and push are WP11.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python infra/docker/fixture_bundle.py bundles/fixture
      - run: >-
          docker build -f infra/docker/api.Dockerfile --build-context bundle=bundles/fixture
          -t sbc-api:ci .
      - run: infra/docker/smoke.sh sbc-api:ci

  cdk:
    name: CDK stacks synthesize and pass their template tests
    runs-on: ubuntu-latest
    steps:
      # docs/aws/MIGRATION_PLAN.md WP9: the cost guardrails and security rules are template properties
      # (infra/cdk/tests), and both stacks must synthesize. No AWS credentials are needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --project infra/cdk --locked
      - run: uv run --project infra/cdk pytest infra/cdk/tests
      - working-directory: infra/cdk
        run: npx -y aws-cdk@2.1147.0 synth -q -c apiImageTag=ci-synth
      - name: Shell scripts pass shellcheck
        run: uvx --from shellcheck-py shellcheck -x -P SCRIPTDIR -s bash scripts/aws/*.sh infra/docker/*.sh

  frontend:
    name: Frontends lint, typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      # docs/aws/MIGRATION_PLAN.md WP10. Node comes with the runner image (20 LTS or newer).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  changes:
    name: Decide whether to deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main_AWS'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          # Until the first manual deploy sets AWS_DEPLOY_ROLE_ARN (docs/aws/RUNBOOK.md section 4), skip quietly.
          if [ -z "$ROLE" ]; then
            echo "::notice::not deploying: the repository variable AWS_DEPLOY_ROLE_ARN isn't set yet"
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Docs-only pushes don't deploy. Anything else does, and so does a push whose base is unknown.
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Ev '^(docs/|spikes/|[^/]+\.md$)' || true)
          else
            other=unknown
          fi
          echo "changed outside docs: ${other:-nothing}"
          echo "deploy=$([ -n "$other" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to AWS
    # docs/aws/MIGRATION_PLAN.md WP11: only after every check passes, only from main_AWS.
    needs: [changes, lint, typecheck, test, secrets, eval-gate, image, cdk, frontend]
    if: needs.changes.outputs.deploy == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-aws.yml
