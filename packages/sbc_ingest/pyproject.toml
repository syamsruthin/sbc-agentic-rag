[project]
name = "sbc-ingest"
version = "0.0.0"
description = "Catalog, download, convert and verify SBC PDFs. The current scripts/ move here in Phase 0."
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11",
    "requests>=2.31",
    "sbc-core",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbc_ingest"]

[project.scripts]
sbc-portal = "sbc_ingest.portal:main"
sbc-to-markdown = "sbc_ingest.to_markdown:main"
sbc-verify = "sbc_ingest.verify:main"
