# Base configuration shared by both bots and every environment.
# Layering (later wins): base.yaml -> bots/<bot>.yaml -> env/<env>.yaml -> SBC_* environment variables.
# Secrets never go in these files; they come from environment variables (on AWS, loaded from SSM Parameter Store
# at cold start). See .env.example.

models:
  # Every model call goes through OpenRouter (PLAN.md section 3.6).
  classify:
    model: anthropic/claude-haiku-5.5
    effort: low
  agent:
    model: anthropic/claude-sonnet-5.5
    effort: low
    fallbacks: [anthropic/claude-sonnet-5, anthropic/claude-haiku-5.5]
  judge:
    model: anthropic/claude-opus-5.5
    effort: medium
  embeddings:
    model: baai/bge-m3  # ZDR via Parasail and DeepInfra; Voyage has no ZDR endpoint (PLAN.md 8)
    dimensions: 1024
  rerank:
    model: qwen/qwen3-reranker-8b  # only ZDR reranker on OpenRouter (Fireworks); eval-gated (PLAN.md 3.4.3)

# Per-turn limits (PLAN.md section 3.5.6).
budget:
  max_llm_calls: 4
  max_tool_calls: 8
  max_identical_tool_calls: 3
  recursion_limit: 12
  wall_clock_seconds: 25
  max_input_tokens: 30000

# Hybrid search over the facts bundle (PLAN.md section 3.4.3).
retrieval:
  prefetch_limit: 20
  rrf_k: 60
  rerank_candidates: 20
  keep_per_plan: 6
  rerank_enabled: true
  max_plans_per_search: 6
  synonym_expansion: true  # BM25 query gets the SBC labels of services it names ("MRI" -> "Imaging (CT/PET...)")
