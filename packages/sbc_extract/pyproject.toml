[project]
name = "sbc-extract"
version = "0.0.0"
description = "Deterministic SBC Markdown to structured rows: cost grammar, limit parsers and validators."
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "sbc-core",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbc_extract"]
