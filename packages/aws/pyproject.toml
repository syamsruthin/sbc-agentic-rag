[project]
name = "sbc-aws"
version = "0.0.0"
description = "AWS adapters: SSM secrets, DynamoDB checkpointer and app data, rate limits, caches, audit, S3 PDF cache."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.64",
    "langgraph-checkpoint-aws==1.2.6",
    "sbc-core",
]

[project.scripts]
sbc-create-tables = "sbc_aws.schema:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbc_aws"]
