[project]
name = "sbc-core"
version = "0.0.0"
description = "Domain types, configuration, the facts and search readers, and the OpenRouter gateway."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.5",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbc_core"]

[project.scripts]
sbc-llm-smoke = "sbc_core.llm_smoke:main"
