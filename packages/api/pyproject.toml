[project]
name = "sbc-api"
version = "0.0.0"
description = "FastAPI app: auth, rate limits, SSE streaming, admin endpoints and audit."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.54",
    "sbc-agent",
    "sbc-aws",
    "sbc-core",
    "langfuse>=5.0.4,<5.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbc_api"]
