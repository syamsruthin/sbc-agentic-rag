[project]
name = "sbc-agent"
version = "0.0.0"
description = "LangGraph agent: graph, nodes, prompts, verifier, renderer and guards."
requires-python = ">=3.13"
dependencies = [
    "sbc-core",
    "sbc-retrieval",
    "sbc-tools",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbc_agent"]
